{{- if and .Values.cronjob .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.cronjob.name | default (printf "%s-scheduler" .Release.Name) }}
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished | default 300 }}
      template:
        spec:
          restartPolicy: Never
          {{- if .Values.podSecurityContext }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- end }}
          containers:
            - name: schedule
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
              command:
                {{- toYaml .Values.cronjob.command | nindent 16 }}

              {{- if or .Values.useConfig .Values.useSecret }}
              envFrom:
                {{- if .Values.useConfig }}
                - configMapRef:
                    name: {{ .Release.Name }}-config
                {{- end }}
                {{- if .Values.useSecret }}
                - secretRef:
                    name: {{ .Release.Name }}-secret
                {{- end }}
              {{- end }}
{{- end }}