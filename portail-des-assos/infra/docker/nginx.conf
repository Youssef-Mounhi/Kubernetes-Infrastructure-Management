server {
    # The server will listen on port 8005
    listen 8080;

    # The server's domain name or IP address
    server_name pda-tx.assos.utc.fr;

    # Set the maximum allowed file size for uploads
    client_max_body_size 10M;

    # Define the root directory for the web server to serve files from
    root /var/www/html/public;

    # Set the default index files to be served when a directory is requested
    index index.php index.html index.htm;

    # The main location block that handles all requests
    location / {
        # Try to serve the request as a file or directory; if not found, pass to index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP file requests
    location ~ \.php$ {
        # Include the default FastCGI parameters
        include fastcgi_params;

        # Specify the FastCGI server (using a Unix socket for PHP-FPM)
        fastcgi_pass unix:/run/php-fpm.sock;

        # Use index.php as the default file to process PHP requests
        fastcgi_index index.php;

        # Set the SCRIPT_FILENAME parameter for PHP-FPM, which points to the script to execute
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny access to .htaccess files, which are often used for Apache server configurations
    location ~ /\.ht {
        deny all;
    }
}
