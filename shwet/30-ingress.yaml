apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shwet
  namespace: tx-shwet
  annotations:

spec:
  ingressClassName: traefik   
  rules:
    - host: shwet-tx.assos.utc.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shwet
                port:
                  number: 80

