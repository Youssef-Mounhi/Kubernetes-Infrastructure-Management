apiVersion: v1
kind: Namespace
metadata:
  name: site-vitrine-simde
---
# Source: generic-app/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: site-vitrine-simde-secret
  namespace: site-vitrine-simde
type: Opaque
stringData:
---
# Source: generic-app/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-vitrine-simde-config
  namespace: site-vitrine-simde
data:
---
# Source: generic-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: site-vitrine-simde-service
  namespace: site-vitrine-simde
spec:
  type: ClusterIP
  selector:
    app: site-vitrine-simde
  ports:
    - port: 80
      name: http
      targetPort: 80
---
# Source: generic-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-vitrine-simde-deployment
  namespace: site-vitrine-simde
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site-vitrine-simde
  template:
    metadata:
      labels:
        app: site-vitrine-simde
        app.kubernetes.io/name : site-vitrine-simde
        app.kubernetes.io/instance : site-vitrine-simde
        app.kubernetes.io/component : webapp
    spec:
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: app
          image: "youssef129/site-vitrine-simde:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
---
# Source: generic-app/templates/ingress.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: site-vitrine-simde-route
  namespace: site-vitrine-simde
spec:
  entryPoints:
    - web
  routes:
    - match: >
        Host("tx-kube.assos.utc.fr")
        && PathPrefix("/simde")
      kind: Rule
      middlewares:
        - name: site-vitrine-simde-strip-prefix
      services:
        - name: site-vitrine-simde-service
          port: 80
---
# Source: generic-app/templates/middleware-strip-prefix.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: site-vitrine-simde-strip-prefix
  namespace: site-vitrine-simde
spec:
  stripPrefix:
    prefixes:
      - "/simde"
