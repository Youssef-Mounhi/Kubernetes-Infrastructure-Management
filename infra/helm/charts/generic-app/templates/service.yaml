apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-service" .Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      name: {{ .Values.service.name }}
      targetPort: {{ .Values.containerPort }}
  