apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "shwet.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "shwet.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      name: {{ .Values.service.name }}
      targetPort: {{ .Values.containerPort }}