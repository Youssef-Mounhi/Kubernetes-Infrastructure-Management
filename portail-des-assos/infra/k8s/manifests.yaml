apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portail-des-assos-route
  namespace: portail-des-assos
spec:
  entryPoints:
    - web
  routes:
    - match: >
        Host("pda-tx.assos.utc.fr")
      kind: Rule
      services:
        - name: portail-des-assos-service
          port: 80
