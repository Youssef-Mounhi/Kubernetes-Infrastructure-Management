apiVersion: apps/v1
kind: Deployment
metadata:
  name: shwet
  namespace: tx-shwet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shwet
  template:
    metadata:
      labels:
        app: shwet
    spec:

      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: app
          image: registry.gitlab.utc.fr/simde/shwet:latest
          imagePullPolicy: Always

          command: ["sh", "-c", "/var/www/html/laravel-setup.sh"]
          
          ports:
            - containerPort: 8005
          
          envFrom:
            - configMapRef:
                name: shwet-env
            - secretRef:
                name: shwet-secret
          
          readinessProbe:
            httpGet:
              path: /
              port: 8005
            initialDelaySeconds: 40
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          volumeMounts:

            - name: phpfpm-www
              mountPath: /etc/php83/php-fpm.d/www.conf
              subPath: www.conf
            - name: documents
              mountPath: /var/www/html/storage/app/public/documents
            - name: logs
              mountPath: /var/www/html/storage/logs
      
      volumes:
        - name: phpfpm-www
          configMap:
            name: shwet-phpfpm
        - name: documents
          persistentVolumeClaim:
            claimName: longhorn-documents-rwx
        - name: logs
          persistentVolumeClaim:
            claimName: longhorn-logs-rwx
