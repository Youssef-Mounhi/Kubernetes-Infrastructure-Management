# Source: generic-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portail-des-assos-deployment
  namespace: portail-des-assos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portail-des-assos
  template:
    metadata:
      labels:
        app: portail-des-assos
        app.kubernetes.io/name : portail-des-assos
        app.kubernetes.io/instance : portail-des-assos
        app.kubernetes.io/component : webapp
    spec:
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      initContainers:
        - command:
          - sh
          - -c
          - |
            # Check if directory is empty (excluding lost+found)
            if [ -z "$(ls -A /mnt/storage | grep -v '^lost+found$')" ]; then
              echo "PVC is empty, seeding with default images..."
              cp -r /var/www/html/storage/app/public/. /mnt/storage/
              echo "Seeding complete"
            else
              echo "PVC contains files:"
              ls -la /mnt/storage
              echo "Skipping seed"
            fi
          image: youssef129/pda:latest
          name: seed-storage
          volumeMounts:
          - mountPath: /mnt/storage
            name: pda-volume
      containers:
        - name: app
          image: "youssef129/pda:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: portail-des-assos-config
            - secretRef:
                name: portail-des-assos-secret

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - mountPath: /var/www/html/storage/app/public
              name: pda-volume
      volumes:
        - name: pda-volume
          persistentVolumeClaim:
            claimName: pda-storage
---
